extensions:
  basicauth/metrics:
    client_auth:
      username: "${GRAFANA_CLOUD_METRICS_USERNAME}"
      password: "${GRAFANA_CLOUD_METRICS_PASSWORD}"

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: "prometheus-federation"
          honor_labels: true
          metrics_path: "/federate"
          params:
            "match[]":
              - '{__name__=~".+"}'
          static_configs:
            - targets: ["prometheus:9090"]

exporters:
  prometheusremotewrite:
    endpoint: "${GRAFANA_CLOUD_METRICS_URL}"
    auth:
      authenticator: basicauth/metrics

service:
  extensions: [basicauth/metrics]
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]

# Log shipping (filelog → Loki) deferred until production deployment.
# On a real server/K8s, add:
#   - filelog receiver reading /var/lib/docker/containers/*/*.log
#   - loki exporter with basicauth/logs extension
#   - logs pipeline in service.pipelines
