services:
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.migrate
    environment:
      DATABASE_URL: postgres://templar:templar@postgres:5432/templar
    command: migrate run --source /migrations
    volumes:
      - ../packages/db/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  minio-init:
    image: minio/mc:latest
    environment:
      MC_HOST_local: http://templar:templar123@minio:9000
    entrypoint: >
      sh -c "mc mb --ignore-existing local/templar-assets"
    depends_on:
      minio:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: templar-api
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgres://templar:templar@postgres:5432/templar
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      API_PORT: "8080"
      RUST_LOG: info
      # Templates directory inside the container — matches COPY in Dockerfile.api
      TEMPLATES_DIR: /app/templates
      # config.toml path inside the container (mounted below)
      CONFIG_TOML_PATH: /app/config.toml
    volumes:
      - ../config.toml:/app/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - default
      - monitoring
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: templar-web
    ports:
      - "3001:3001"
    env_file:
      - ../.env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      WEB_PORT: "3001"
      PORT: "3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: templar-postgres
    environment:
      POSTGRES_DB: templar
      POSTGRES_USER: templar
      POSTGRES_PASSWORD: templar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U templar -d templar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: templar-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: templar-minio
    environment:
      MINIO_ROOT_USER: templar
      MINIO_ROOT_PASSWORD: templar123
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10-alpine
    container_name: templar-nats
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: templar-clickhouse
    ports:
      - "8123:8123"   # HTTP only — native TCP (9000) conflicts with MinIO host port
    environment:
      CLICKHOUSE_DB: templar_analytics
      CLICKHOUSE_USER: templar
      CLICKHOUSE_PASSWORD: templar
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_LISTEN_HOST: "0.0.0.0"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  analytics:
    build:
      context: ..
      dockerfile: infra/Dockerfile.analytics
    container_name: templar-analytics
    ports:
      - "8090:8090"
    env_file:
      - ../.env
    environment:
      ANALYTICS_PORT: "8090"
      NATS_URL: nats://nats:4222
      CLICKHOUSE_URL: http://clickhouse:8123
      DATABASE_URL: postgres://templar:templar@postgres:5432/templar
      REDIS_URL: redis://redis:6379
      RUST_LOG: info
    depends_on:
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Observability stack ───────────────────────────────────────────────────

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8888:8080"  # host:8080 taken by api — remap to 8888
    networks:
      - monitoring
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    networks:
      - monitoring
    restart: unless-stopped

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: postgres_exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://templar:templar@postgres:5432/templar?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - monitoring
      - default
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    container_name: otel-collector
    volumes:
      - ./otel/otel-collector.yml:/etc/otel/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: ["--config=/etc/otel/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  clickhouse_data:
  prometheus_data:

networks:
  default:
    driver: bridge
  monitoring:
    driver: bridge
