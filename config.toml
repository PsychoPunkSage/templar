#cargo install taplo-cli --locked ╔══════════════════════════════════════════════════════════════════╗
# ║                   Templar Configuration                         ║
# ║                                                                  ║
# ║  This file provides defaults for all tunable parameters.        ║
# ║  Environment variables ALWAYS override values here.             ║
# ║  Override any field by setting the corresponding env var.       ║
# ╚══════════════════════════════════════════════════════════════════╝

[concurrency]

# ── Context Ingestion ─────────────────────────────────────────────

# ingest_worker_count: Number of background workers processing the Redis ingest queue.
# Each worker picks one batch item, runs the 3-phase LLM parse, then stores it.
# Higher = faster throughput for large batches but more DB connections consumed.
# Overridden by: INGEST_WORKER_COUNT env var
#
# How to choose:
#   Free Anthropic tier  (8k   output tokens/min) → 1–2
#   Build tier           (40k  output tokens/min) → 3–4
#   Scale tier           (80k+ output tokens/min) → 6–8
#   Rule of thumb: never exceed (rate_limit_tpm / avg_entry_tokens / 60)
ingest_worker_count = 2

# ingest_llm_concurrency: Maximum number of concurrent LLM calls across ALL ingest
# workers at any instant. This is the primary rate-limit guard.
# A semaphore with this many permits is shared across all workers.
# Overridden by: INGEST_LLM_CONCURRENCY env var
#
# How to choose:
#   Each ingest item fires ~1 Phase A call (~100 output tokens) +
#   N Phase B calls (~300-600 output tokens each, N = chunks in entry).
#   Average total per item ≈ 500–1000 output tokens.
#
#   Max safe concurrency = floor(rate_limit_tpm / avg_tokens_per_call / 60)
#   Free tier (8k TPM):  floor(8000 / 400 / 60) ≈ 0.3 → set to 1 (minimum)
#   Build tier (40k TPM): floor(40000 / 400 / 60) ≈ 1.6 → set to 2–3
#   Scale tier (80k TPM): → set to 4–6
#
#   Setting too high → 429 errors (retried but slow).
#   Setting too low  → ingestion serialized but reliable.
ingest_llm_concurrency = 2

# ── Resume Generation ─────────────────────────────────────────────

# generation_llm_concurrency: Maximum number of parallel per-entry LLM calls during
# resume generation (the JoinSet in call_llm_with_retry).
# Overridden by: GENERATION_LLM_CONCURRENCY env var
#
# How to choose:
#   Same math as ingest_llm_concurrency but generation calls are larger
#   (~300–500 output tokens per entry bullet set).
#   If ingest and generation can run simultaneously, budget must cover both.
#   Recommended: set to half of ingest_llm_concurrency when running together,
#   or equal when generation-only workloads are expected.
#
#   Free tier  → 1–2
#   Build tier → 3–4
#   Scale tier → 5–8
generation_llm_concurrency = 1

# ── Render Pipeline ───────────────────────────────────────────────

# render_worker_count: Number of parallel pdflatex render jobs.
# CPU-bound, not LLM-bound — not rate-limited by Anthropic.
# Set based on available CPU cores. Each job spawns a pdflatex process.
# Overridden by: RENDER_WORKER_COUNT env var
#
# How to choose:
#   Docker default (2 vCPU): 2–3
#   4 vCPU: 4
#   Never exceed (available_cores - 1) to keep system responsive
render_worker_count = 4

[ingestion]

# bullet_token_budget: Estimated token budget per bullet-extraction LLM call chunk.
# Tokens are estimated as: char_count / 4 (rough approximation).
# If an entry exceeds this budget, it's split into smaller sub-chunks.
# Overridden by: BULLET_TOKEN_BUDGET env var
#
# How to choose:
#   Lower (800–1200):  More chunks, more LLM calls, each call is smaller and faster.
#                      Better for rate-limited tiers. Slightly more overhead.
#   Higher (1500–2500): Fewer calls, but larger prompts risk output truncation
#                       if the entry has many detailed bullets.
#   Recommended default: 1200 for free/build tiers, 2000 for scale tier.
#   Never set above 3000 — approaches the MAX_TOKENS ceiling.
bullet_token_budget = 1200

[persona_suggestion]

# min_entries_required: Minimum number of context entries the user must have before
# the suggestion LLM call is attempted. Below this threshold the handler returns []
# immediately with no LLM token spend.
# Overridden by: PERSONA_SUGGEST_MIN_ENTRIES env var
#
# How to choose:
#   3 (default): Minimum viable signal — enough for at least 2 distinct tag clusters.
#   5+: Stricter signal before spending LLM tokens; better for rate-limited tiers.
#   Never set to 0 — the LLM produces nonsense suggestions with no context.
min_entries_required = 3

# max_count: Maximum number of persona suggestions to request from the LLM.
# Also applied as a hard cap post-response (LLM may return fewer).
# Overridden by: PERSONA_SUGGEST_MAX_COUNT env var
#
# How to choose:
#   3 (default): Enough variety without overwhelming the user.
#   1–2: Conservative — only suggest if context clearly splits into distinct roles.
#   Never set above 5 — degrades suggestion quality and increases prompt token cost.
max_count = 3

# top_tags: Number of highest-frequency tags sent to the LLM in the prompt.
# These are the primary signal for role archetype detection.
# Overridden by: PERSONA_SUGGEST_TOP_TAGS env var
#
# How to choose:
#   20 (default): Covers the long tail of a typical 10–30 entry context.
#   10–15: Smaller prompts, less context, potentially lower quality suggestions.
#   25–30: Useful for users with very diverse 50+ entry contexts.
top_tags = 20

# top_entries: Number of highest-scoring context entries (recency × impact)
# sent to the LLM as labelled context samples (type + name + tags only, no bullets).
# Overridden by: PERSONA_SUGGEST_TOP_ENTRIES env var
#
# How to choose:
#   8 (default): Captures the most relevant entries without bloating the prompt.
#   5: More conservative. Fine for focused, homogeneous contexts.
#   12: Better for users with varied career tracks (backend + ML + leadership).
top_entries = 8

# dedup_jaccard_threshold: Jaccard tag-overlap threshold for filtering suggestions
# that are semantically equivalent to an existing persona.
# Jaccard(A, B) = |A ∩ B| / |A ∪ B|. A value > threshold means "too similar, skip."
# Overridden by: PERSONA_SUGGEST_DEDUP_THRESHOLD env var
#
# Examples at threshold = 0.6:
#   "C++ Dev" {cpp, systems, perf}  vs  "Senior C++ Dev" {cpp, systems, perf, leadership}
#   Jaccard = 3/4 = 0.75 → filtered out ✓
#
# How to choose:
#   0.6 (default): Catches reworded duplicates while allowing genuinely distinct personas.
#   0.4: Stricter — removes suggestions with moderate tag overlap.
#   0.8: Permissive — only filters near-identical suggestions.
#   0.0: Disables Jaccard dedup (only name-containment check remains active).
dedup_jaccard_threshold = 0.6

[content_limits]

# experience_limit: Maximum number of experience entries selected for a single-page resume.
# Higher values risk page overflow; lower values may omit relevant history.
# Overridden by: EXPERIENCE_LIMIT env var
experience_limit = 8

# project_limit: Maximum number of project entries selected for a single-page resume.
# Overridden by: PROJECT_LIMIT env var
project_limit = 4

# other_limit: Maximum entries for all other section types (skills, publications, etc.)
# per single-page resume.
# Overridden by: OTHER_LIMIT env var
other_limit = 3

# cv_experience_limit: Maximum experience entries per page in CV (multi-page) mode.
# Overridden by: CV_EXPERIENCE_LIMIT env var
cv_experience_limit = 12

# cv_project_limit: Maximum project entries per page in CV (multi-page) mode.
# Overridden by: CV_PROJECT_LIMIT env var
cv_project_limit = 6

# cv_other_limit: Maximum other section entries per page in CV mode.
# Overridden by: CV_OTHER_LIMIT env var
cv_other_limit = 4

[layout]

# max_fill_passes: Maximum page fill remediation passes (expand/compress/remove)
# before flagging the resume for human review. After this many passes, the output
# is returned as-is with page_fill_flagged = true.
# Overridden by: MAX_FILL_PASSES env var
max_fill_passes = 3

# max_post_render_retries: Maximum number of times the render worker will drop the
# lowest-scoring sub-entry and re-render when the PDF exceeds the target page count.
# Each retry calls pdflatex again (expensive); keep this low.
# Overridden by: MAX_POST_RENDER_RETRIES env var
max_post_render_retries = 2
